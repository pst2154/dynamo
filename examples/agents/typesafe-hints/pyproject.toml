[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typesafe-dynamo-agent-hints"
version = "0.1.0"
description = "TypeSafe-powered NVIDIA Dynamo agent hints proxy"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4", "certifi>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2"]

[project.scripts]
typesafe-agent-hints = "typesafe_agent_hints.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/typesafe_agent_hints"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["pre_merge: fast regression tests", "gpu_0: no GPU required", "unit: isolated policy tests", "integration: local HTTP tests"]
